name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The same source deploys from two accounts:
      #  - hacu9/victor-portafolio builds under the repo subpath.
      #  - devakros/devakros.github.io is a USER SITE and builds at the root.
      # `site` follows the account so sitemap/asset URLs resolve correctly.
      SITE_BASE: ${{ github.repository == 'devakros/devakros.github.io' && '/' || '/victor-portafolio' }}
      SITE_URL: ${{ github.repository == 'devakros/devakros.github.io' && 'https://devakros.github.io' || 'https://hacu9.github.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # Astro 5 requires Node >=22.12; the action defaults to 20.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
