name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Un repo llamado `<user>.github.io` es un USER SITE de GitHub Pages y
      # construye en la raíz; cualquier otro repo (p. ej. victor-portafolio)
      # es un project site bajo `/<repo>`. `site` sigue la cuenta para que el
      # sitemap y las URLs SEO apunten al origen correcto.
      SITE_BASE: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}', github.event.repository.name) }}
      SITE_URL: ${{ format('https://{0}.github.io', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # Astro 5 requires Node >=22.12; the action defaults to 20.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
